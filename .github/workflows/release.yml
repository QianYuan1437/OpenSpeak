name: Build & Release

# main  -> rebuilds the rolling "latest" pre-release
# v*    -> formal release; notes = the tag's annotation message
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.41.7

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/text_test.dart test/gpu_extract_test.dart test/updater_test.dart

  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
            echo "name=${base}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: [test, version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter build windows --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }} --dart-define=OPENSPEAK_VERSION=${{ needs.version.outputs.name }}
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\OpenSpeak-${{ needs.version.outputs.name }}-windows-x64.zip
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          Write-Host "Using $($iscc.FullName)"
          & $iscc.FullName /DAppVersion=${{ needs.version.outputs.name }} /Odist windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  linux:
    needs: [test, version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libayatana-appindicator3-dev libx11-dev lld
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter build linux --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }} --dart-define=OPENSPEAK_VERSION=${{ needs.version.outputs.name }}
      - run: tools/package_linux.sh ${{ needs.version.outputs.name }}
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  android:
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - name: Build APKs
        run: |
          V=${{ needs.version.outputs.name }}
          flutter build apk --release --split-per-abi --build-name=$V --build-number=${{ github.run_number }} --dart-define=OPENSPEAK_VERSION=$V
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp build/app/outputs/flutter-apk/app-$abi-release.apk dist/OpenSpeak-$V-android-$abi.apk
          done
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/* }

  publish:
    needs: [version, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist && (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Formal release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" dist/* --title "OpenSpeak $GITHUB_REF_NAME" --notes-file notes.md
      - name: Rolling latest pre-release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (${{ needs.version.outputs.name }})" \
            --notes "Automatic build of \`main\` at ${GITHUB_SHA::7}. For stable versions see the tagged releases."
